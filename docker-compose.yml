services:
  api:
    build: .
    environment:
      DB_HOST: host.docker.internal
      REDIS_HOST: redis
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis
  celery:
    build: .
    environment:
      DB_HOST: host.docker.internal
      REDIS_HOST: redis
    command: celery -A src.tasks.tasks_app.celery_instance worker -B --pool=solo --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"